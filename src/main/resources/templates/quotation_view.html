<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>報價單</title>
    <script th:src="@{/js/quotation_view.js}"></script>
</head>
<body>
<section layout:fragment="content">

    <div style="padding: 20px;">
        <h3 class="mb-4">報價單明細</h3>

        <div class="d-flex justify-content-end mb-3">
            <button type="button" class="btn btn-sm btn-secondary" onclick="back()">
                <i class="bi bi-arrow-left"></i> 返回
            </button>
        </div>

        <div class="row mt-4 g-3">

            <!-- 左邊表格區 -->
            <div class="col-md-9">

                <table class="table">
                    <thead>
                    <tr>
                        <th>產品名稱</th>
                        <th>產品代號</th>
                        <th>產品尺寸</th>
                        <th>產品單位</th>
                        <th>數量</th>
                        <th>成本</th>
                        <th>成本總計</th>
                        <th>報價</th>
                        <th>報價總計</th>
                        <th>議價</th>
                        <th>議價金額</th>
                    </tr>
                    </thead>
                    <tbody id="quotationCreateTableBody">

                    </tbody>
                </table>
            </div>

            <!-- 右邊卡片區 -->
            <div class="col-md-3 d-flex flex-column gap-3">
                <!-- 客戶資訊 Card -->
                <div class="card">
                    <div class="card-header">客戶資訊</div>
                    <div class="card-body">
                        <div class="row mb-2 align-items-center">
                            <div class="col-2"><strong>客戶</strong></div>
                            <div class="col-10"><div class="col-8"><span id="customerName"></span></div></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-2"><strong>電話</strong></div>
                            <div class="col-10"><span id="customerPhone"></span></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-2"><strong>地址</strong></div>
                            <div class="col-10"><span id="customerAddress"></span></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-2"><strong>聯絡人</strong></div>
                            <div class="col-10"><span id="customerContact"></span></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-2"><strong>備註</strong></div>
                            <div class="col-10"><span id="remark"></span></div>
                        </div>
                    </div>
                </div>

                <!-- 總計 Card -->
                <div class="card">
                    <div class="card-header">總計</div>
                    <div class="card-body">
                        <div class="row mb-2">
                            <div class="col-6"><strong>數量總計</strong></div>
                            <div class="col-6 text-end"><strong><span id="totalQuantity">0</span></strong></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6"><strong>成本總計</strong></div>
                            <div class="col-6 text-end"><strong><span id="totalCost" class="text-success">0</span></strong></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6"><strong>報價總計</strong></div>
                            <div class="col-6 text-end"><strong><span id="totalPrice" class="text-primary">0</span></strong></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6"><strong>議價總計</strong></div>
                            <div class="col-6 text-end"><strong><span id="totalNegotiatedPrice" class="text-secondary">0</span></strong></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6"><strong>獲利總計</strong></div>
                            <div class="col-6 text-end"><strong><span id="totalProfit" class="text-danger">0</span></strong></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</section>
</body>
</html>
