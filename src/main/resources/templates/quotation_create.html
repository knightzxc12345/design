<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>報價單</title>
    <script th:src="@{/js/quotation_create.js}"></script>
    <style>
        /* 固定送出按鈕在最下方 */
        .submit-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 10px 20px;
            background-color: #fff;
            border-top: 1px solid #ddd;
            z-index: 999;
        }

        /* 總計區塊樣式 */
        .total-block {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 60px; /* 預留送出按鈕空間 */
        }
        .total-item {
            margin-left: 30px;
        }
        .total-item span {
            font-weight: bold;
        }
    </style>
</head>
<body>
<section layout:fragment="content">
    <div style="padding: 20px;">
        <h3 class="mb-4">新增報價單</h3>

        <div class="row mt-4 g-3">

            <!-- 左邊表格區 -->
            <div class="col-md-8">

                <div class="d-flex justify-content-end mb-3">
                    <button type="button" class="btn btn-sm btn-success" onclick="addQuotationRow()">
                        <i class="bi bi-plus"></i> 新增一列
                    </button>
                </div>

                <table class="table">
                    <thead>
                    <tr>
                        <th>產品名稱</th>
                        <th>產品代號</th>
                        <th>產品尺寸</th>
                        <th>產品單位</th>
                        <th>數量</th>
                        <th>成本</th>
                        <th>報價</th>
                        <th>成本總計</th>
                        <th>報價總計</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="quotationCreateTableBody">

                    </tbody>
                </table>
            </div>

            <!-- 右邊卡片區 -->
            <div class="col-md-4 d-flex flex-column gap-3">
                <!-- 客戶資訊 Card -->
                <div class="card">
                    <div class="card-header">客戶資訊</div>
                    <div class="card-body">
                        <div class="row mb-2 align-items-center">
                            <div class="col-4"><strong>客戶</strong></div>
                            <div class="col-8">
                                <select id="customerSelect" class="form-select form-select-sm" onchange="onCustomerSelect(this)">
                                </select>
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-4"><strong>電話</strong></div>
                            <div class="col-8"><span id="customerPhone"></span></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-4"><strong>地址</strong></div>
                            <div class="col-8"><span id="customerAddress"></span></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-4"><strong>聯絡人</strong></div>
                            <div class="col-8"><span id="customerContact"></span></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-4"><strong>備註</strong></div>
                            <div class="col-8"><textarea class="form-control" id="remark" maxlength="512" rows="3" style="resize: none;"></textarea></div>
                        </div>
                    </div>
                </div>

                <!-- 總計 Card -->
                <div class="card">
                    <div class="card-header">總計</div>
                    <div class="card-body">
                        <div class="row mb-2">
                            <div class="col-6"><strong>數量總計</strong></div>
                            <div class="col-6 text-end"><strong><span id="totalQuantity">0</span></strong></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6"><strong>成本總計</strong></div>
                            <div class="col-6 text-end"><strong><span id="totalCost" class="text-success">0</span></strong></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6"><strong>報價總計</strong></div>
                            <div class="col-6 text-end"><strong><span id="totalPrice" class="text-primary">0</span></strong></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6"><strong>獲利總計</strong></div>
                            <div class="col-6 text-end"><strong><span id="totalProfit" class="text-danger">0</span></strong></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 送出按鈕，放在 section 最下方 -->
        <div class="mt-4">
            <button class="btn btn-success w-100" onclick="submitQuotation()">
                <strong>送出報價單</strong>
            </button>
        </div>

    </div>
</section>
</body>
</html>
